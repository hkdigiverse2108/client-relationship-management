<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIO CRM - Enterprise Customer Relationship Management platform" />
    <title>AIO CRM | Enterprise CRM Platform</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
      }
      .crm-preloader-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #f8fafc;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
      .crm-preloader-container.fade-out {
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      /* GPU Accelerated Loader */
      .crm-loader-chart {
        position: relative;
        width: 140px;
        height: 120px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-bottom: 4px; /* for base line */
      }
      .crm-loader-base {
        position: absolute;
        bottom: 0;
        left: -10px;
        right: -10px;
        height: 4px;
        background-color: #cbd5e1;
        border-radius: 2px;
      }
      .crm-loader-bar {
        width: 24px;
        border-radius: 4px;
        transform-origin: bottom;
      }
      .crm-bar1 { 
        height: 50px; 
        background-color: #bae6fd; 
        animation: crmBounce1 2s infinite ease-in-out; 
      }
      .crm-bar2 { 
        height: 75px; 
        background-color: #38bdf8; 
        animation: crmBounce2 2s infinite ease-in-out 0.3s; 
      }
      .crm-bar3 { 
        height: 105px; 
        background-color: #0284c7; 
        animation: crmBounce3 2s infinite ease-in-out 0.6s; 
      }
      @keyframes crmBounce1 { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.6); } }
      @keyframes crmBounce2 { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.4); } }
      @keyframes crmBounce3 { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.23); } }
    </style>
  </head>
  <body>
    <div id="global-preloader" class="crm-preloader-container">
      <div class="crm-loader-chart">
        <div class="crm-loader-bar crm-bar1"></div>
        <div class="crm-loader-bar crm-bar2"></div>
        <div class="crm-loader-bar crm-bar3"></div>
        <div class="crm-loader-base"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
